<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Popup Box</title>
</head>
<body>
    <h1>HELLO WORLD</h1>

<script>
    
    alert('selamat datang');
    var lagi = true;

    while( lagi === true ) {
        var nama = prompt('masukan nama:');
        alert('haloo ' + nama);

        lagi = confirm('coba lagi?');
    }

    alert('terima kasih..');

</script>
</body>
</html>
