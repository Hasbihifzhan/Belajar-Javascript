<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 4</title>
</head>
<body>
    <h1>LATIHAN 4</h1>

<script>
    var s = ''

    for( var i = 1; i <= 10; i++) {
        for( var j = 1; j <= i; j++) {
            s += ' '
        }
    
    for( var k = 10; k >= (2*i - 10); k--) {
        s += '*'
        }

        s += '\n'

    }
    
    console.log(s)
</script>
</body>
</html>
