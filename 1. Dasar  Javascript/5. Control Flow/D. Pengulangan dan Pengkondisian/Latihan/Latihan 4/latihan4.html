<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 4</title>
</head>
<body>
    <h1>Latihan 4</h1>

    <script>

        var s = ''

        for( var i = 0; i <= 10; i++) {
            for( var j = 0; j <= i; j++) {
            s += ' '
        }
    
        for( var k = 10; k >= i; k--) {
            s += '*'
            }

            s += '\n'

        }

        for ( var i = 0; i <= 10; i++ ) {
            for( var j = 10; j >= i; j--) {
            s += ' ';
        }

        for (var k = 0; k <= i; k++) {
            s += '*'
        }

            s += '\n'

        }

        console.log(s);

    </script>
</body>
</html>
