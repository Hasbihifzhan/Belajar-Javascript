<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2</title>
</head>
<body>
    <h1>LATIHAN 2</h1>

<script>

    var s = ''

    for( var i = 10; i >= 0; i--) {
        for( var j = 0; j <= i; j++) {
            s += '*'
        }
            s += '\n'
    }

    for( var k = 0; k <= 10; k++) {
        for( var l = 0; l <= k; l++) {
            s += '*'
        }
            s += '\n'
    }

    console.log(s)

</script>
</body>
</html>
