<script>
    var s = ''

    for( var i = 1; i <= 10; i++) {
        for( var j = 10; j >= i; j--) {
            s += ' ';
        }

    for( var k = 1; k <= i + (i - 1); k++) {
            s += '*'
        }

        s += '\n'

    }
console.log(s)




</script>
