<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 7</title>
</head>
<body>
    <h1>LATIHAN 7</h1>

<script>
    var s = ''

    for( var i = 1; i <= 10; i++) {
        for( var j = 10; j >= i; j--) {
            s += ' '
        }

        for( var k = 1; k <= i + (i - 1); k++) {
            s += '*'
        }
        s += '\n'
    }

    for( var h = 1; h <= 10; h ++) {
        for( var g = 1; g <= h; g++) {
            s += ' '
        }
    
    for( var f = 10; f >= (2*h - 10); f--) {
            s += '*'
        }
        s += '\n'
    }
      
    console.log(s)
</script>
</body>
</html>
