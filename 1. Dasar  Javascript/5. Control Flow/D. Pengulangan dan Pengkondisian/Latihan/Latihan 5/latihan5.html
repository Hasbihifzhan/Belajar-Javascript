<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5</title>
</head>
<body>
    <h1>LATIHAN 5</h1>

<script>
    var s = ''

    for( var i = 1; i <= 10; i++) {
        for( var j = 10; j >= i; j--) {
            s += ' ';
        }

    for( var k = 1; k <= i + (i - 1); k++) {
            s += '*'
        }

        s += '\n'

    }
console.log(s)

// i = 1 : adalah jumlah bintang di baris pertama
// s += ' ' : adalah spasi
// i + (i - 1) :
//     1 + (1 - 1) = 1
//     2 + (2 - 1) = 3
//     3 + (3 - 1) = 5
//     4 + (4 - 1) = 7
//     5 + (5 - 1) = 9
//     6 + (6 - 1) = 11
//     7 + (7 - 1) = 13
//     8 + (8 - 1) = 15
//     9 + (9 - 1) = 17
//     10 + (10 - 1) = 19
//  untuk mencetak total bintang pada tiap barisnya


</script>
</body>
</html>
