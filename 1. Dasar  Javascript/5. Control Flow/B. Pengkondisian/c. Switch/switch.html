    // kode ini adalah untuk kalkulator sederhana

    var nilai1 = parseInt(prompt('Masukan nilai 1'))
    var nilai2 = parseInt(prompt('Masukan nilai 2'))
    var operator = prompt('Masukan operator + - * /')

    switch(operator) {
        case '+' :
            alert(nilai1 + nilai2)
            break;
        case '-' :
            alert(nilai1 - nilai2)
            break;
        case '*' :
            alert(nilai1 * nilai2)
            break;
        case '/' :

            break;
        default :
